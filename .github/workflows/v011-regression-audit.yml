name: v011-regression-audit

on:
  push:
    branches: [audit/v011-replacement-regression]
  pull_request:
    branches: [agent/project-recovery-window-lifecycle]

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt
      - name: Compile Python sources
        run: python -m compileall desktop_app speech_bubble_editor
      - name: Run desktop unit tests
        run: python -m unittest discover -s tests/desktop -p 'test_*.py' -v
      - name: Run comic core tests
        run: node tests/comic_panels_core_test.cjs
      - name: Run comic converter integration tests
        run: node tests/comic_converter_integration_test.cjs
      - name: Run editor integration tests
        run: node tests/comic_editor_integration_test.cjs
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check web/desktop/desktop-shell.js
          node --check web/comic-editor.js
          node --check tests/runtime_v011_regression_audit.cjs
      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Run v0.1.1 replacement, save, recovery, and display audit
        run: node tests/runtime_v011_regression_audit.cjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v011-regression-audit-results
          path: audit-v011-results.json
          if-no-files-found: ignore
