name: Quick Retouch reconciliation and final validation
on:
  push:
    branches: [work/quick-retouch-port-20260926]
    paths:
      - .github/workflows/quick-retouch-port.yml
      - tools/reconcile_quick_retouch.py
permissions:
  contents: read
concurrency:
  group: quick-retouch-port-20260926
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    outputs:
      candidate: ${{ steps.prepare.outputs.candidate }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: seed
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 438b2635617cde5b6e990c99fb76fc91b839c36d
          path: target
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Reconcile only the add-only output boundary
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          python seed/tools/reconcile_quick_retouch.py target
          cd target
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          files = json.loads(Path('port-files.json').read_text())
          subprocess.run(['git','add','--',*files], check=True)
          Path('port-files.json').unlink()
          PY
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep selected Comic panel unchanged when applying Quick Retouch' -m 'Preserve the concurrently validated Quick Retouch port on main. Use the existing Page Image importer for add-only Comic output, without changing background removal, BW conversion, storage, dependencies or release assets. Add an occupied-panel browser regression.'
          sha=$(git rev-parse HEAD)
          branch="work/quick-retouch-reconciled-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$branch"
          echo "candidate=$sha" >> "$GITHUB_OUTPUT"
          mkdir -p ../port-artifacts
          git diff HEAD^ HEAD --binary > ../port-artifacts/quick-retouch-reconciliation.patch
          printf '%s\n' "$sha" > ../port-artifacts/candidate-sha.txt
          echo "CANDIDATE_SHA=$sha"
      - uses: actions/upload-artifact@v6
        with:
          name: quick-retouch-reconciliation-patch
          path: port-artifacts/
          retention-days: 7
  core:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install existing renderer test font
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install -r requirements-ci.txt
      - run: python tools/validate_repo.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: quick-retouch-core-${{ matrix.os }}
          path: artifacts/
          retention-days: 7
  browser:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install -r requirements-ci.txt
      - name: Install existing Playwright test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/sbe-browser" --no-save playwright
          "$RUNNER_TEMP/sbe-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/sbe-browser/node_modules" >> "$GITHUB_ENV"
      - run: node tests/quick_retouch_browser_smoke.cjs
      - run: node tests/desktop_browser_smoke.cjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: quick-retouch-browser-evidence
          path: artifacts/
          retention-days: 7
  complete:
    needs: [prepare, core, browser]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'ALL_GATES_PASS candidate=${{ needs.prepare.outputs.candidate }}; main has not been moved by this workflow.'
