name: Quick Retouch port and final validation
on:
  push:
    branches: [work/quick-retouch-port-20260926]
    paths:
      - .github/workflows/quick-retouch-port.yml
      - tools/port_quick_retouch.py
      - tools/quick_retouch_desktop_gate.cjs
      - tools/refine_quick_retouch.py
permissions:
  contents: read
concurrency:
  group: quick-retouch-port-20260926
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    outputs:
      candidate: ${{ steps.prepare.outputs.candidate }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: seed
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 192623f17dc054101f8ef4a6ea5926b12c1a7f90
          path: target
          persist-credentials: true
      - uses: actions/checkout@v5
        with:
          repository: ukr8b3g-cmyk/Speech-Bubble-Comic-Editor-for-Forge-Neo
          ref: 929752a2080f7eb8be680ad29f6868d753acf729
          path: donor
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Implement approved port before tests
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          python seed/tools/port_quick_retouch.py target donor seed
          cd target
          git restore -- .github/workflows/validate.yml
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys
          files = json.loads(Path('port-files.json').read_text())
          files.remove('.github/workflows/validate.yml')
          # Tool rerenders can remove the focused button. Capture at the window
          # while modal, before host shortcuts, so body focus is also handled.
          quick = Path('web/quick-retouch.js')
          text = quick.read_text()
          for event, asynchronous in [('keydown', False), ('keyup', False), ('paste', True)]:
              prefix = f'    dialog.addEventListener("{event}", ' + ('async event => {' if asynchronous else '(event) => {')
              assert text.count(prefix) == 1, prefix
              start = text.index(prefix)
              end = text.index('\n    });', start) + len('\n    });')
              block = text[start:end]
              block = block.replace('dialog.addEventListener', 'root.addEventListener', 1)
              block = block.replace('event.stopPropagation();', 'event.stopImmediatePropagation();')
              block = block[:-3] + '}, true);'
              text = text[:start] + block + text[end:]
          quick.write_text(text, encoding='utf-8', newline='\n')
          test = Path('tests/quick_retouch_integration_test.cjs')
          text = test.read_text().replace(r'/dialog\.addEventListener\("keydown"/', r'/root\.addEventListener\("keydown"/')
          test.write_text(text, encoding='utf-8', newline='\n')
          smoke = Path('tests/desktop_browser_smoke.cjs')
          text = smoke.read_text()
          anchor = '(async () => {\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + '  const isolated = require("node:child_process").spawnSync(process.execPath, ["tests/quick_retouch_browser_smoke.cjs"], {stdio:"inherit"});\n  if (isolated.status !== 0) throw new Error("Quick Retouch isolated browser gate failed");\n', 1)
          smoke.write_text(text, encoding='utf-8', newline='\n')
          subprocess.run([sys.executable,'../seed/tools/refine_quick_retouch.py','.'], check=True)
          subprocess.run(['git','add','--',*files], check=True)
          Path('port-files.json').unlink()
          PY
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Port Quick Retouch into standalone three-workspace editor' -m 'Preserve pinned Forge 0.7.10 tools and core. Integrate exact Single Image source context and shared Page Images, add-only output without replacing selected panels, modal event isolation, session cleanup, documentation and final regression gates. Distribution and release assets remain unchanged.'
          sha=$(git rev-parse HEAD)
          branch="work/quick-retouch-candidate-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$branch"
          echo "candidate=$sha" >> "$GITHUB_OUTPUT"
          mkdir -p ../port-artifacts
          git diff HEAD^ HEAD --binary > ../port-artifacts/quick-retouch.patch
          printf '%s\n' "$sha" > ../port-artifacts/candidate-sha.txt
          echo "CANDIDATE_SHA=$sha"
      - uses: actions/upload-artifact@v6
        with:
          name: quick-retouch-port-patch
          path: port-artifacts/
          retention-days: 7
  core:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install existing renderer test font
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install -r requirements-ci.txt
      - run: python tools/validate_repo.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: quick-retouch-core-${{ matrix.os }}
          path: artifacts/
          retention-days: 7
  browser:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install -r requirements-ci.txt
      - name: Install existing Playwright test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/sbe-browser" --no-save playwright
          "$RUNNER_TEMP/sbe-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/sbe-browser/node_modules" >> "$GITHUB_ENV"
      - run: node tests/desktop_browser_smoke.cjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: quick-retouch-browser-evidence
          path: artifacts/
          retention-days: 7
  complete:
    needs: [prepare, core, browser]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'ALL_GATES_PASS candidate=${{ needs.prepare.outputs.candidate }}; main has not been moved by this workflow.'
